[project]
name = "webui-replica-backend"
version = "0.1.0"
description = "FastAPI backend for WebUI Replica"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143",  # app.frontend()
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sqlmodel>=0.0.22",
    "alembic>=1.13",
    "cryptography>=43",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "anthropic>=1.13",
    "pypdf>=5",
    "python-docx>=1.1",
    "python-multipart>=0.0.20",
    "ddgs>=9.16",  # keyless web search (DuckDuckGo and other engines)
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# --- Vercel (project Root Directory: backend) ------------------------------
# Entrypoint is detected automatically: app/main.py exports `app`.

[tool.vercel.scripts]
build = "python -m app.vercel_build"

[tool.vercel.fastapi.static]
# Serve the frontend from the CDN even though the app has CORS middleware.
cdn = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
