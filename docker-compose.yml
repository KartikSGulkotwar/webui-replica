services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webui
      POSTGRES_PASSWORD: webui
      POSTGRES_DB: webui
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webui -d webui"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://webui:webui@postgres:5432/webui
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      PROVIDERS_READ_ONLY: ${PROVIDERS_READ_ONLY:-false}
      CHAT_RATE_LIMIT_PER_MINUTE: ${CHAT_RATE_LIMIT_PER_MINUTE:-20}
      # Browsers reach the backend through the frontend's nginx proxy.
      TRUSTED_PROXY_HOPS: 1
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
    # Lets providers reach services on the host machine (Ollama/LM Studio
    # installed natively) as host.docker.internal, on Linux as well as macOS.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  postgres-data:
  ollama-data:
