# The FastAPI backend. Replicas share Postgres; startup work (migrations,
# seeding) is serialized with a Postgres advisory lock, so they can start
# together. Rate limits and sessions live in the database, so any replica can
# serve any request.
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
      annotations:
        # For Prometheus setups that scrape by annotation (send METRICS_TOKEN
        # as a bearer token).
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /api/metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # Streams can run for minutes: give them time to finish on shutdown.
      terminationGracePeriodSeconds: 60
      containers:
        - name: backend
          image: webui-replica-backend
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: webui-config
            - secretRef:
                name: webui-secrets
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg://webui:$(POSTGRES_PASSWORD)@postgres:5432/webui
            - name: OTEL_SERVICE_NAME
              value: webui-replica
          startupProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 3
            failureThreshold: 60 # migrations on first start
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /api/ready, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
